trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  # Azure resources created by Terraform
  REGISTRY: scholiq.azurecr.io
  ACR_NAME: scholiqprod
  APP_NAME: scholiq-prod-api
  RESOURCE_GROUP: scholiq-prod-rg

stages:
  - stage: BuildAndPush
    jobs:
      - job: Build
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - task: Docker@2
            displayName: Build backend image
            inputs:
              command: build
              repository: backend
              dockerfile: 'backend/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(Build.BuildId)
                latest

          # Login to ACR using Azure CLI credentials from a Service Connection
          - task: AzureCLI@2
            displayName: Login to ACR
            inputs:
              azureSubscription: 'AZURE_SERVICE_CONNECTION'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name $(ACR_NAME)

          # Tag and push to ACR
          - task: Docker@2
            displayName: Push backend image to ACR
            inputs:
              command: push
              repository: backend
              containerRegistry: 'ACR_SERVICE_CONNECTION'
              tags: |
                $(Build.BuildId)
                latest

  - stage: Deploy
    dependsOn: BuildAndPush
    jobs:
      - job: DeployWebApp
        steps:
          # Deploy container to App Service (expects the image tag to be available in ACR)
          - task: AzureWebAppContainer@2
            displayName: Deploy backend to App Service
            inputs:
              azureSubscription: 'AZURE_SERVICE_CONNECTION'
              appName: '$(APP_NAME)'
              containers: |
                $(REGISTRY)/backend:latest

